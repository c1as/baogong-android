name: 构建 Android APK

# 触发方式：
# - 手动点 Run workflow（最常用）
# - 推送代码 / 打 v* 标签时自动构建
on:
  workflow_dispatch:
  push:
    branches: [ main, android-v3.0 ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 并接受许可
        uses: android-actions/setup-android@v3

      - name: 安装构建所需 SDK 组件
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # 签名策略：
      # - 若仓库配置了 Secrets（KEYSTORE_BASE64 等），用正式签名密钥；
      # - 否则在 CI 里临时生成一个密钥签名，保证产出的 APK 可安装。
      - name: 准备签名密钥
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "使用仓库 Secrets 中的正式签名密钥"
            echo "$KEYSTORE_BASE64" | base64 -d > ci-release.jks
            echo "storeFile=ci-release.jks" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          else
            echo "未配置 Secrets，生成临时签名密钥（仅用于让 APK 可安装）"
            keytool -genkeypair -v -keystore ci-release.jks \
              -alias baogong -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass 123456 -keypass 123456 \
              -dname "CN=Baogong CI, OU=CI, O=Baogong, L=NA, ST=NA, C=CN" > /dev/null 2>&1
            echo "storeFile=ci-release.jks" > keystore.properties
            echo "storePassword=123456" >> keystore.properties
            echo "keyAlias=baogong" >> keystore.properties
            echo "keyPassword=123456" >> keystore.properties
          fi

      - name: 赋予 gradlew 执行权限
        working-directory: android
        run: chmod +x gradlew

      - name: 构建 Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 校验产物
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/release/*.apk
          echo "APK 路径：app/build/outputs/apk/release/"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: baogong-helper-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
